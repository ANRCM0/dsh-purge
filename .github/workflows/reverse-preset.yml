name: Reverse preset checks

on:
  push:
    branches:
      - feat/rea-reverse-agent-mvp
      - feat/rea-managed-installer
  pull_request:
    paths:
      - "lib/reverse/**"
      - "client.js"
      - "scripts/build-client.mjs"
      - "lib/identity.js"
      - "lib/index.js"
      - "presets/reverse-engineering/**"
      - "skills/reverse-engineering/**"
      - "tests/reverse-*.test.mjs"
      - "package.json"

jobs:
  reverse-preset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check lib/reverse/index.js
          node --check lib/reverse/tools.js
          node --check lib/reverse/workspace.js
          node --check lib/reverse/doctor.js
          node --check lib/reverse/install.js
          node --check lib/reverse/rea-launcher.cjs
          node --check lib/reverse/view.js
          node --check lib/reverse/ui.js
          node --check lib/reverse/client.js
          node --check client.js
          node --check scripts/build-client.mjs
          node --check lib/identity.js
          node --check lib/index.js
      - name: Check embedded client synchronization
        run: |
          npm run build:client
          git diff --exit-code -- client.js
      - name: Reverse preset unit tests
        run: npm run test:reverse
